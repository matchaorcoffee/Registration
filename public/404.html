<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Evently</title>
  <script>
    // GitHub Pages SPA redirect:
    // Encode the full path/query/hash into a single ?p= query param,
    // then redirect to the root index.html which will decode it back.
    var l = window.location;
    var segments = l.pathname.slice(1).split('/');
    var repo = segments[0]; // e.g. "Registration"
    var rest = segments.slice(1).join('/'); // e.g. "event/evt-abc/register"
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      '/' + repo +
      '/?p=' + rest.replace(/&/g, '~and~') +
      (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>

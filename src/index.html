<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Evently — Event Registration, RSVP & Fast QR Check-In</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Modern Clean Google Fonts (Outfit & Plus Jakarta Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <!-- GitHub Pages SPA routing: decode the redirect from 404.html -->
  <script>
    (function() {
      var redirect = window.location.search.slice(1);
      if (redirect) {
        var decoded = {};
        redirect.split('&').forEach(function(part) {
          var eq = part.indexOf('=');
          var key = part.slice(0, eq);
          var val = eq >= 0 ? decodeURIComponent(part.slice(eq + 1)) : '';
          decoded[key] = val;
        });
        if (decoded.p !== undefined) {
          var path = decoded.p.replace(/~and~/g, '&');
          var query = decoded.q ? '?' + decoded.q.replace(/~and~/g, '&') : '';
          var base = (document.querySelector('base') && document.querySelector('base').getAttribute('href')) || '/';
          if (!base.endsWith('/')) base += '/';
          var fullPath = base + (path ? path : '') + query;
          window.history.replaceState(null, null, fullPath);
        }
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
